
name: Compilar FlowEdge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FlowEdge-AMOLED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          test -f FlowEdge-AMOLED.zip
          mkdir -p extracted
          unzip -q FlowEdge-AMOLED.zip -d extracted
          test -f extracted/FlowEdge/settings.gradle.kts
          test -f extracted/FlowEdge/app/build.gradle.kts

      - name: Compilar APK
        working-directory: extracted/FlowEdge
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: FlowEdge-debug-APK
          path: extracted/FlowEdge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
