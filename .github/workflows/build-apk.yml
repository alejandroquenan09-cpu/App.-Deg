
name: Compilar FlowEdge APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias Android
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Extraer proyecto ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún ZIP en la raíz"
            exit 1
          fi
          mkdir -p extraido
          unzip -q "$ZIP" -d extraido
          echo "ZIP extraído: $ZIP"

      - name: Compilar APK
        run: |
          GRADLEW=$(find extraido -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew dentro del ZIP"
            find extraido -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$DIR"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowEdge-APK
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
